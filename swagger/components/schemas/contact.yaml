type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType
  - userId
properties:
  _id:
    description: 'Contact id'
    type: string
    example: 65e4decdd286b30065d54af9

  name:
    description: 'Contact name'
    type: string
    example: 'John Doe'

  phoneNumber:
    description: 'Contact phone number'
    type: string
    example: '+90 555 555 55 55'

  email:
    description: 'Contact email'
    type: string
    example: 'john@example.com'

  isFavourite:
    description: 'Is contact marked as favourite'
    type: boolean
    example: false

  contactType:
    description: 'Type of contact'
    type: string
    enum: ['work', 'home', 'personal']
    example: 'personal'

  userId:
    description: 'Owner user id'
    type: string
    example: 65e4decdd286b30065d54af9

  photo:
    description: 'Contact photo URL'
    type: string
    example: 'https://res.cloudinary.com/.../image.png'
