tags:
  - Contacts
summary: Update contact
operationId: updateContact
description: 'Update a contact by id'
security:
  - bearerAuth: []

parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598384'

requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            example: 'John Doe'
          phoneNumber:
            type: string
            example: '+90 555 555 55 55'
          email:
            type: string
            example: 'john@example.com'
          isFavourite:
            type: boolean
            example: true
          contactType:
            type: string
            enum: ['work', 'home', 'personal']
            example: 'home'
          photo:
            type: string
            example: 'https://res.cloudinary.com/.../image.png'

responses:
  '200':
    description: Successfully updated contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully updated contact!'
            data:
              type: object
              $ref: '../../../components/schemas/contact.yaml'

  '404':
    $ref: '../../../components/responses/404.yaml'

  '401':
    $ref: '../../../components/responses/401.yaml'
